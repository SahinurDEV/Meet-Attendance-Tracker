<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Attendance Tracker</title>
  <link rel="stylesheet" href="ui/theme.css">
  <link rel="stylesheet" href="ui/popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="brand"><strong>Meet Attendance</strong><span class="muted">Tracker</span></div>
    <span class="chip" title="Nothing ever leaves your device">🔒 Local only</span>
  </header>

  <main>
    <section id="live" class="card live-card" aria-live="polite"></section>

    <section class="card settings" aria-label="Quick settings">
      <label class="set"><span><b>Auto-save</b><small class="muted">Save attendance during the call</small></span>
        <span class="switch"><input type="checkbox" id="autoSave"><span></span></span></label>
      <label class="set"><span><b>Ignore my own name</b><small class="muted">Hide yourself in lists &amp; exports</small></span>
        <span class="switch"><input type="checkbox" id="ignoreSelf"><span></span></span></label>
      <div class="set"><span><b>Time format</b></span>
        <span class="seg" id="timeFormat"><button data-v="24h">24h</button><button data-v="12h">12h</button></span></div>
    </section>

    <section class="recent">
      <div class="rec-head"><h3>Recent meetings</h3><a href="#" id="allMeetings">View all</a></div>
      <div id="recent"></div>
    </section>
  </main>

  <footer>
    <button class="btn primary" id="openDashboard">Open dashboard</button>
    <button class="btn" id="openSettings" title="All settings">Settings</button>
  </footer>

  <script src="lib/core.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/export.js"></script>
  <script src="ui/common.js"></script>
  <script src="ui/popup.js"></script>
</body>
</html>
