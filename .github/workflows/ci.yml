name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Manifest checks (MV3, permissions, no remote code)
        run: npm run lint:manifest

      - name: Install system tools for PDF checks and Bengali text
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-core

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Chromium's new headless mode can load extensions, so no xvfb is needed.
      - name: Integration tests (Playwright + unpacked extension)
        run: npm run test:integration

      - name: Package extension (Chrome/Edge + Firefox)
        run: |
          npm run package
          npm run package:firefox

      - name: Firefox add-on lint (web-ext)
        run: npm run lint:firefox

      - name: Upload extension zip
        uses: actions/upload-artifact@v6
        with:
          name: meet-attendance-tracker-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
