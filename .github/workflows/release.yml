name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.1.1"
        required: true
      dry_run:
        description: "Dry run: build and upload the zips as an artifact only (no GitHub Release, no Chrome Web Store)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      zip: ${{ steps.pkg.outputs.zip }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the extension version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest version $v"
            exit 1
          fi

      - name: Lint and unit tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-core
          npm run lint
          npm run test:unit

      - name: Package
        id: pkg
        run: |
          npm run package
          npm run package:firefox
          zip=$(ls dist/meet-attendance-tracker-v*.zip | grep -v -- -firefox)
          ffzip=$(ls dist/meet-attendance-tracker-v*-firefox.zip)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "ffzip=$ffzip" >> "$GITHUB_OUTPUT"
          sha256sum "$zip" > "$zip.sha256"
          sha256sum "$ffzip" > "$ffzip.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: release-zip
          path: dist/

      - name: Create or update the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="${{ steps.pkg.outputs.zip }}"
          ffzip="${{ steps.pkg.outputs.ffzip }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$zip.sha256" "$ffzip" "$ffzip.sha256" --clobber
          else
            gh release create "$TAG" "$zip" "$zip.sha256" "$ffzip" "$ffzip.sha256" --title "Meet Attendance Tracker $TAG" --generate-notes --verify-tag
          fi

  chrome-web-store:
    name: Publish to Chrome Web Store (optional)
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || 'knhhplmldjejlbhpnhgcbcbnglghoblm' }}
    steps:
      - name: Check Chrome Web Store credentials
        id: creds
        run: |
          missing=""
          for v in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN PUBLISHER_ID EXTENSION_ID; do
            [ -n "${!v}" ] || missing="$missing CWS_$v"
          done
          if [ -n "$missing" ]; then
            echo "Skipping Chrome Web Store publish; missing secrets:$missing (see CONTRIBUTING.md#releases)."
            echo "### Chrome Web Store publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          name: release-zip
          path: dist

      - name: Upload and submit for review
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes chrome-webstore-upload-cli@4 --source "${{ needs.build.outputs.zip }}"
