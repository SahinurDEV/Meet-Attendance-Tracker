name: ✨ Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/SahinurDEV/Meet-Attendance-Tracker#roadmap) and existing issues first. Thanks!
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "As a teacher, I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works without sending data off the device, or any network use would be strictly opt-in.
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help build this.
