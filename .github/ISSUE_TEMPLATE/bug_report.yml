name: 🐞 Bug report
description: Something doesn't work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't include real participant names, emails or chat content**. Use made-up examples instead.
        Security problems go to [SECURITY.md](https://github.com/SahinurDEV/Meet-Attendance-Tracker/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join a Meet call with 3 participants
        2. Open the Attendance panel
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: ext-version
    attributes:
      label: Extension version
      description: Shown on the extension card at chrome://extensions
      placeholder: "2.1.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 141 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Participant detection / attendance
        - Speaking time
        - Chat capture
        - Rosters / statuses
        - In-Meet panel
        - Popup
        - Dashboard / analytics
        - Exports (CSV, XLSX, PDF, JSON)
        - Translations
        - Other
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options: [English, Bengali (বাংলা), Other]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or anything else
      description: Errors from the Meet tab console, or from "Inspect views → service worker" on chrome://extensions.
